services:
  # ── Nginx Reverse Proxy (Unified entrypoint on Port 80) ─────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    networks: [portal_net]
    restart: unless-stopped

  # ── Frontend (React SPA) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    networks: [portal_net]
    restart: unless-stopped

  # ── Django API (Connected to Neon DB & Cloudinary) ───────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 4 --timeout 60 --access-logfile - --error-logfile -
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      # Neon Database
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      # Cloudinary Storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      # Redis & Networking
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
    networks: [portal_net]
    restart: unless-stopped
    expose:
      - "8000"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -Q default,notifications,grades,files --concurrency 4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
    depends_on:
      - api
    networks: [portal_net]
    restart: unless-stopped

  # ── Celery Beat (scheduler) ─────────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-portal_db}
      DB_USER: ${DB_USER:-portal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-uniportal-profile picture}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devredispassword}@redis:6379/0}
    depends_on:
      - api
    networks: [portal_net]
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2.11-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-devredispassword}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devredispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [portal_net]
    restart: unless-stopped

volumes:
  redis_data:

networks:
  portal_net:
    driver: bridge
