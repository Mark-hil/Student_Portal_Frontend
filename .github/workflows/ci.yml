name: Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # Phase 1: TypeScript Static Type Checking
  # ─────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Strict Check
        run: npm run type-check

  # ─────────────────────────────────────────────────────────────
  # Phase 2: Production Bundle Compilation
  # ─────────────────────────────────────────────────────────────
  build-bundle:
    name: Production Vite Bundle Build
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        env:
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Phase 3: Docker Multi-Stage Image Build Verification
  # ─────────────────────────────────────────────────────────────
  docker-build-check:
    name: Frontend Docker Image Build Check
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: student-portal-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Phase 4: Final Pipeline Status Gate
  # ─────────────────────────────────────────────────────────────
  ci-pipeline-complete:
    name: Frontend CI Complete
    needs: [build-bundle, docker-build-check]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Checks Passed
        run: |
          echo "All frontend TypeScript validations, Vite production bundle builds, and Docker container tests passed successfully!"
