name: Frontend CD Pipeline (Publish to Docker Registry)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: Build Docker Container Image
  # ─────────────────────────────────────────────────────────────
  build-image:
    name: Stage 1 — Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          tags: student-portal-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker Image Archive
        run: |
          docker save student-portal-frontend:test -o /tmp/frontend-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: /tmp/frontend-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Stage 2: Container Smoke & Web Server Verification
  # ─────────────────────────────────────────────────────────────
  test-image:
    name: Stage 2 — Smoke Test Built Image
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load --input /tmp/frontend-image.tar
          docker images

      - name: Run Nginx Container Smoke Test
        run: |
          echo "Starting temporary Nginx test container on port 8080..."
          docker run -d --name smoke-test-frontend -p 8080:80 student-portal-frontend:test
          sleep 2
          
          echo "Testing HTTP response from container..."
          curl -f -I http://localhost:8080/
          
          echo "Cleaning up test container..."
          docker rm -f smoke-test-frontend
          echo "✅ Frontend Nginx container smoke test passed! HTML served successfully."

  # ─────────────────────────────────────────────────────────────
  # Stage 3: Publish Verified Image to Docker Registry
  # ─────────────────────────────────────────────────────────────
  publish-image:
    name: Stage 3 — Publish to Docker Hub
    needs: [test-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/student-portal-frontend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Download Verified Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image
          path: /tmp

      - name: Load and Push Image to Docker Hub
        run: |
          docker load --input /tmp/frontend-image.tar
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "Tagging and pushing $tag..."
            docker tag student-portal-frontend:test "$tag"
            docker push "$tag"
          done

      - name: Publish Deployment Summary to GitHub Actions
        run: |
          echo "## 🚀 Verified Frontend Docker Image Successfully Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/student-portal-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Smoke Test Status: **PASSED (Nginx Web Server & Static Bundle verified)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Published Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
