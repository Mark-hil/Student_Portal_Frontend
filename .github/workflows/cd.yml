name: Frontend CD Pipeline (Publish to Docker Registry)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # Continuous Deployment: Build, Smoke Test & Publish
  # ─────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build, Verify & Publish Frontend to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/student-portal-frontend
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build Docker Image (Local Test Target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          tags: student-portal-frontend:pre-push-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── PRE-PUSH CONTAINER SMOKE TESTS ──────────────────────────
      - name: Run Container Image Smoke Tests
        run: |
          echo "Starting temporary Nginx test container on port 8080..."
          docker run -d --name smoke-test-frontend -p 8080:80 student-portal-frontend:pre-push-test
          sleep 2
          
          echo "Testing HTTP response from container..."
          curl -f -I http://localhost:8080/
          
          echo "Cleaning up test container..."
          docker rm -f smoke-test-frontend
          echo "✅ Frontend Nginx container smoke test passed! HTML served successfully."

      # ── PUSH VERIFIED IMAGE TO DOCKER HUB ────────────────────────
      - name: Push Verified Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || '/api/v1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Publish Deployment Summary to GitHub Actions
        run: |
          echo "## 🚀 Verified Frontend Docker Image Successfully Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ secrets.DOCKERHUB_USERNAME }}/student-portal-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Smoke Test Status: **PASSED (Nginx Web Server & Static Bundle verified)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Published Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
